# CI + deploy: every pull request and every push to main runs the regression
# gate and the Playwright suites. GitHub Pages is published by THIS workflow
# (Pages source = "GitHub Actions"), and only after the gate job is green: a red
# run deploys nothing, so the live site stays on the last green state — even for
# a direct push to main.
#
# What gets published is an allowlist (tools/build-site.mjs): the game, its
# service worker, manifest, icons and audio cues — nothing else. The debug and
# preview pages of the character-art pipeline stay in the repository but are no
# longer public. The gate job builds and smoke-tests that exact site on every PR.
#
# Windows runner on purpose: tools/verify.mjs drives the system Edge through raw
# CDP and launches it via PowerShell Start-Process, exactly as on the dev
# machine. windows-latest ships Edge, PowerShell and Git Bash.
#
# Deliberately NOT here:
#   tools/pw_perf.py     timing thresholds under 6x CPU throttling; already red
#                        on the dev machine, so on a shared CI VM it would only
#                        teach people to ignore a red check.
#   tools/pw_netseal.py  needs the public MQTT broker (internet), so it runs in its
#                        own non-blocking job below: visible on every PR, but a
#                        broker outage never blocks a deploy.
#
# The full online co-op run (tools/pw_coop_run.py) DOES block the deploy, in its
# own coop-run job: 22/22 clean CI runs before it was promoted, 9/9 of the
# current three-session version (six of them in parallel on the same broker),
# no connection retry needed once. It still needs a third-party broker, so it
# runs with --broker-outage-ok: if connecting fails on every try it asks the
# brokers directly; none reachable -> a loud warning and a skip (an outage must
# not hold up releases), any reachable -> the game is at fault -> red.
#
# After every deploy, the live-coop job checks the PUBLIC site the way players
# meet it: two players connect over co-op with a real room code. That one is
# deliberately blocking — a red run there means the live game is broken.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main are not, so a deployment is
  # never cut off halfway by the next push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Gate + Playwright
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the stamp check below diffs against the base commit

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install chromium

      - name: Gate — static legs, selftest, BalanceSim, throttle (tools/verify.mjs)
        run: node tools/verify.mjs

      # Separate steps on purpose: GitHub's pwsh wrapper only checks the exit code
      # of the LAST command in a multi-line step, so a failed build would be masked.
      - name: Pages artifact — build the allowlist (tools/build-site.mjs)
        if: success() || failure()
        run: node tools/build-site.mjs

      - name: Pages artifact — smoke-test the built site (tools/site-smoke.mjs)
        if: success() || failure()
        run: node tools/site-smoke.mjs

      - name: Playwright — recon (page loads, no crash)
        if: success() || failure()
        run: python tools/pw_recon.py

      - name: Playwright — critical loop (pw_walk)
        if: success() || failure()
        run: python tools/pw_walk.py

      - name: Playwright — volume ladder (pw_vol_probe)
        if: success() || failure()
        run: python tools/pw_vol_probe.py

      - name: Playwright — careless-user abuse (pw_abuse)
        if: success() || failure()
        run: python tools/pw_abuse.py

      - name: Playwright — beat-grid sync (pw_beatsync)
        if: success() || failure()
        run: python tools/pw_beatsync.py

      - name: Playwright — danger curve (pw_danger)
        if: success() || failure()
        run: python tools/pw_danger.py

      - name: Playwright — LUFS harness (pw_lufs)
        if: success() || failure()
        run: python tools/pw_lufs.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: docs/pw/*.png
          retention-days: 7
          if-no-files-found: ignore

  coop:
    name: Co-op over the public broker (non-blocking)
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true   # external dependency: report, never block
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install chromium
      # Two browsers connect as host and guest over the real broker; an eavesdropper
      # on this session's own topics must see neither room code nor IP.
      - name: Sealed co-op signaling end to end (pw_netseal)
        run: python tools/pw_netseal.py
      # The post-deploy check, run on this PR's own build: menus, room code typed
      # as shown, traffic both ways (guest input -> host, host picture -> guest).
      - name: Two players connect over co-op on this build (pw_live_coop --serve)
        run: python tools/pw_live_coop.py --serve .

  coop-run:
    name: Full online co-op run (blocking)
    runs-on: windows-latest   # same runner the co-op jobs proved WebRTC on
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install chromium
      # A whole online co-op run on this build: character pick, wave 1, level-ups,
      # shop, wave 2, a pause from each side, player 2 going down and coming back,
      # the guest dropping, rejoining and taking player 2 back, the host dropping.
      # Both players must see (live frames, HUD, menus) and control (movement,
      # picks, purchases) the same game. A broker outage skips loudly, a game bug
      # fails (see the header).
      - name: Full online co-op run (pw_coop_run)
        run: python tools/pw_coop_run.py --broker-outage-ok

  deploy:
    name: Deploy to GitHub Pages
    needs: [gate, coop-run]   # the whole point: no green gate and co-op run, no deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      published: ${{ steps.published.outputs.sha1 }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/configure-pages@v5
      # Built from the same allowlist the gate job just smoke-tested.
      - name: Build the allowlisted site
        run: node tools/build-site.mjs
      # Fingerprints of what goes live, so the post-deploy check can wait until
      # the CDN really serves this build (Pages caches up to 10 minutes).
      - id: published
        name: Fingerprint the published files
        run: |
          echo "sha1=$(for f in index.html data.js sw.js; do printf '%s=%s,' "$f" "$(sha1sum "_site/$f" | cut -c1-40)"; done)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  live-coop:
    name: Live site — two players connect over co-op
    needs: deploy
    # Only after a real deploy; a failure here is loud on purpose (red run,
    # ::error annotations, job summary, GitHub's failed-run notification).
    if: needs.deploy.result == 'success'
    runs-on: windows-latest   # same runner the co-op job proved WebRTC on
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install chromium
      # Waits until the CDN serves exactly the deployed files, then host and guest
      # connect through the menus with the room code shown on screen, and game
      # traffic must flow both ways. Up to 3 tries with a fresh room each, because
      # the MQTT broker is a third party; every failed try is kept as a warning.
      - name: Two players connect over co-op on the live site (pw_live_coop)
        run: python tools/pw_live_coop.py --url "${{ needs.deploy.outputs.page_url }}" --expect "${{ needs.deploy.outputs.published }}"
