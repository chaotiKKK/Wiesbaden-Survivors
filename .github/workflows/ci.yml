# CI + deploy: every pull request and every push to main runs the regression
# gate and the Playwright suites. GitHub Pages is published by THIS workflow
# (Pages source = "GitHub Actions"), and only after the gate job is green: a red
# run deploys nothing, so the live site stays on the last green state — even for
# a direct push to main.
#
# What gets published is an allowlist (tools/build-site.mjs): the game, its
# service worker, manifest, icons and audio cues — nothing else. The debug and
# preview pages of the character-art pipeline stay in the repository but are no
# longer public. The gate job builds and smoke-tests that exact site on every PR.
#
# Windows runner on purpose: tools/verify.mjs drives the system Edge through raw
# CDP and launches it via PowerShell Start-Process, exactly as on the dev
# machine. windows-latest ships Edge, PowerShell and Git Bash.
#
# Deliberately NOT here:
#   tools/pw_perf.py     timing thresholds under 6x CPU throttling; already red
#                        on the dev machine, so on a shared CI VM it would only
#                        teach people to ignore a red check.
#   tools/pw_netseal.py  needs the public MQTT broker (internet), so it runs in its
#                        own non-blocking job below: visible on every PR, but a
#                        broker outage never blocks a deploy.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main are not, so a deployment is
  # never cut off halfway by the next push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Gate + Playwright
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the stamp check below diffs against the base commit

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install chromium

      # If index.html changes, the service-worker cache name has to change with
      # it, or installed players keep the old cached game. Compared as a diff, so
      # it does not depend on how git converts line endings on checkout.
      - name: Service-worker cache stamp moves with index.html
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; else base="${{ github.event.before }}"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "no comparable base commit — skipped"; exit 0
          fi
          if git diff --quiet "$base" HEAD -- index.html; then echo "index.html unchanged"; exit 0; fi
          if git diff "$base" HEAD -- sw.js | grep -q "^+const CACHE"; then
            echo "index.html changed and the CACHE stamp in sw.js moved with it"
          else
            echo "::error file=sw.js::index.html changed but the CACHE stamp in sw.js did not — installed players would keep the stale cached game"
            exit 1
          fi

      - name: Gate — static legs, selftest, BalanceSim, throttle (tools/verify.mjs)
        run: node tools/verify.mjs

      # Separate steps on purpose: GitHub's pwsh wrapper only checks the exit code
      # of the LAST command in a multi-line step, so a failed build would be masked.
      - name: Pages artifact — build the allowlist (tools/build-site.mjs)
        if: success() || failure()
        run: node tools/build-site.mjs

      - name: Pages artifact — smoke-test the built site (tools/site-smoke.mjs)
        if: success() || failure()
        run: node tools/site-smoke.mjs

      - name: Playwright — recon (page loads, no crash)
        if: success() || failure()
        run: python tools/pw_recon.py

      - name: Playwright — critical loop (pw_walk)
        if: success() || failure()
        run: python tools/pw_walk.py

      - name: Playwright — volume ladder (pw_vol_probe)
        if: success() || failure()
        run: python tools/pw_vol_probe.py

      - name: Playwright — careless-user abuse (pw_abuse)
        if: success() || failure()
        run: python tools/pw_abuse.py

      - name: Playwright — beat-grid sync (pw_beatsync)
        if: success() || failure()
        run: python tools/pw_beatsync.py

      - name: Playwright — danger curve (pw_danger)
        if: success() || failure()
        run: python tools/pw_danger.py

      - name: Playwright — LUFS harness (pw_lufs)
        if: success() || failure()
        run: python tools/pw_lufs.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: docs/pw/*.png
          retention-days: 7
          if-no-files-found: ignore

  coop:
    name: Co-op over the public broker (non-blocking)
    runs-on: windows-latest
    timeout-minutes: 10
    continue-on-error: true   # external dependency: report, never block
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install chromium
      # Two browsers connect as host and guest over the real broker; an eavesdropper
      # on this session's own topics must see neither room code nor IP.
      - name: Sealed co-op signaling end to end (pw_netseal)
        run: python tools/pw_netseal.py

  deploy:
    name: Deploy to GitHub Pages
    needs: gate            # the whole point: no green gate, no deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/configure-pages@v5
      # Built from the same allowlist the gate job just smoke-tested.
      - name: Build the allowlisted site
        run: node tools/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
